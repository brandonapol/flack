name: Publish to github-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push waits rather than racing.
concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # Served from https://brandonapol.github.io/flack/, so assets need the /flack/ base.
      - run: npm run build -- --base=/flack/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: github-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Publish ${{ github.sha }}'
